<!DOCTYPE html>
<html lang="zh-Hant" class="dark">
<head>

    <meta name="apple-mobile-web-app-capable" content="yes">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Noto Sans TC"', 'Inter', 'sans-serif'],
                    },
                    animation: {
                        'pulse-fast': 'pulse 1.2s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'radar-ping': 'radarPing 2s cubic-bezier(0, 0, 0.2, 1) infinite',
                        'slide-up': 'slideUp 0.25s ease-out forwards',
                        'flash-red': 'flashRed 0.6s ease-out',
                    },
                    keyframes: {
                        radarPing: {
                            '0%': { transform: 'scale(0.8)', opacity: '0.9' },
                            '75%, 100%': { transform: 'scale(2.4)', opacity: '0' },
                        },
                        slideUp: {
                            '0%': { transform: 'translateY(100%)', opacity: '0' },
                            '100%': { transform: 'translateY(0)', opacity: '1' },
                        },
                        flashRed: {
                            '0%, 100%': { boxShadow: 'inset 0 0 0 0 rgba(239, 68, 68, 0)' },
                            '50%': { boxShadow: 'inset 0 0 45px 12px rgba(239, 68, 68, 0.55)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #020617;
            color: #F8FAFC;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        /* Custom scrollbar for sleek mobile container */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #0F172A;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 9999px;
        }
        .sos-glow {
            box-shadow: 0 0 30px rgba(239, 68, 68, 0.45), inset 0 2px 4px rgba(255, 255, 255, 0.3);
        }
        .sos-glow:active {
            transform: scale(0.97);
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.7);
        }
        /* 修正手機版彈出選單與外層水平溢出 */
html, body {
  max-width: 100%;
  overflow-x: hidden;
}

/* 針對底部彈出式選單 / Modal / Sheet 強制貼齊螢幕寬度 */
[class*="sheet"],
[class*="modal"],
[class*="drawer"],
[class*="popup"],
[class*="panel"] {
  left: 0 !important;
  right: 0 !important;
  max-width: 100vw !important;

  box-sizing: border-box !important;
  transform: translateX(0) !important;
}
    </style>
</head>

            <!-- Modal Content -->

    <script>
        // ==========================================
        // 1. NSYSU Campus Hotspot Data & Coordinates
        // ==========================================
        const CAMPUS_ZONES = [
            {
                id: 'seawall',
                icon: '🌊',
                name: '海堤 / 體育館',
                sub: '蓮海路・海資館前',
                x: 118,
                y: 118
            },
            {
                id: 'engineering',
                icon: '⚙️',
                name: '工學院 / 電資大樓',
                sub: '機電館・理學院周邊',
                x: 245,
                y: 82
            },
            {
                id: 'management',
                icon: '🏢',
                name: '管理學院 / 圖資大樓',
                sub: '社科院・行政大樓前',
                x: 192,
                y: 122
            },
            {
                id: 'dorms',
                icon: '🏠',
                name: '武嶺 / 翠亨宿舍區',
                sub: '雨樹・山海樓・武嶺坡道',
                x: 325,
                y: 62
            },
            {
                id: 'tunnel',
                icon: '⛩️',
                name: '西子灣隧道口 / 活中',
                sub: '蔣公行館・萊爾富前',
                x: 342,
                y: 124
            },
            {
                id: 'liberal',
                icon: '🏖️',
                name: '文學院 / 藝術大樓',
                sub: '柴山大道・海域中心',
                x: 138,
                y: 45
            }
        ];

        const ALERT_TTL_MS = 15 * 60 * 1000;      // 15 minutes auto-expiration
        const COOLDOWN_MS = 5 * 60 * 1000;        // 5 minutes anti-spam cooldown per zone

        // Application State
        let alerts = [];
        let selectedZoneId = null;
        let selectedTag = '拖車巡邏移動中';
        let activeZoneFilter = 'all';
        let soundEnabled = true;
        let confirmedIds = new Set();

        // ==========================================
        // 2. Initialization & Seed Data
        // ==========================================
        function init() {
            loadFromStorage();
            renderZoneSelector();
            renderAll();

            // Live countdown & expiration ticker every second
            setInterval(() => {
                checkAutoExpiration();
                renderAlertFeed();
            }, 1000);

            // Subtle realistic fluctuation in online student count
            setInterval(() => {
                const countEl = document.getElementById('online-count');
                const current = parseInt(countEl.textContent, 10);
                const delta = Math.floor(Math.random() * 5) - 2;
                countEl.textContent = Math.max(98, current + delta);
            }, 6000);
        }

        function loadFromStorage() {
            const saved = localStorage.getItem('nsysu_towing_alerts_v1');
            if (saved) {
                try {
                    alerts = JSON.parse(saved);
                    return;
                } catch (e) {
                    console.error('Failed to parse saved alerts', e);
                }
            }

            // Default sample alerts so user immediately understands the system
            const now = Date.now();
            alerts = [
                {
                    id: 'alert-init-1',
                    zoneId: 'engineering',
                    tag: '正在開單 / 準備上夾',
                    note: '白色小貨車式拖吊車停在電資大樓紅線旁，已經在拍照了！',
                    createdAt: now - (3 * 60 * 1000 + 20 * 1000), // 3m 20s ago
                    confirmations: 8,
                    status: 'active' // 'active' | 'cleared'
                },
                {
                    id: 'alert-init-2',
                    zoneId: 'tunnel',
                    tag: '拖車巡邏移動中',
                    note: '剛剛從隧道口開出來往行政大樓方向去',
                    createdAt: now - (22 * 60 * 1000),
                    clearedAt: now - (9 * 60 * 1000),
                    confirmations: 14,
                    status: 'cleared'
                }
            ];
            saveToStorage();
        }

        function saveToStorage() {
            localStorage.setItem('nsysu_towing_alerts_v1', JSON.stringify(alerts));
        }

        // ==========================================
        // 3. Web Audio API Synthesized Emergency Siren
        // ==========================================
        function playEmergencyTone() {
            if (!soundEnabled) return;
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                const ctx = new AudioCtx();
                const now = ctx.currentTime;

                // Two-tone tactical alert chime (High-Low-High)
                const freqs = [880, 659.25, 987.77];
                freqs.forEach((freq, idx) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, now + idx * 0.14);

                    gain.gain.setValueAtTime(0.001, now + idx * 0.14);
                    gain.gain.exponentialRampToValueAtTime(0.25, now + idx * 0.14 + 0.03);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.14 + 0.13);

                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now + idx * 0.14);
                    osc.stop(now + idx * 0.14 + 0.14);
                });
            } catch (e) {
                // Audio context may require prior user gesture on some mobile browsers
            }
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            document.getElementById('icon-sound-on').classList.toggle('hidden', !soundEnabled);
            document.getElementById('icon-sound-off').classList.toggle('hidden', soundEnabled);
            showToast(soundEnabled ? '🔊 已開啟警報提示音效' : '🔇 已靜音警報提示音效');
            if (soundEnabled) playEmergencyTone();
        }

        function requestNotificationPermission() {
            const dot = document.getElementById('notify-dot');
            const label = document.getElementById('notify-label');

            if (!('Notification' in window)) {
                dot.className = 'w-2 h-2 rounded-full bg-emerald-400';
                label.textContent = '模擬推播中';
                showToast('🔔 已啟用應用程式內即時推播通知');
                return;
            }

            Notification.requestPermission().then((perm) => {
                if (perm === 'granted') {
                    dot.className = 'w-2 h-2 rounded-full bg-emerald-400';
                    label.textContent = '推播已開啟';
                    showToast('✅ 系統推播通知已成功開啟！');
                } else {
                    dot.className = 'w-2 h-2 rounded-full bg-sky-400';
                    label.textContent = '站內提醒中';
                    showToast('ℹ️ 瀏覽器權限未開啟，將改以站內橫幅推播提醒');
                }
            });
        }

        // ==========================================
        // 4. Reporting & Anti-Spam Cooldown Logic
        // ==========================================
        function openReportModal(preselectZoneId = null) {
            selectedZoneId = preselectZoneId;
            document.getElementById('custom-note').value = '';
            updateZoneSelectionUI();
            document.getElementById('report-modal').classList.remove('hidden');
        }

        function closeReportModal() {
            document.getElementById('report-modal').classList.add('hidden');
        }

        function renderZoneSelector() {
            const grid = document.getElementById('zone-grid');
            grid.innerHTML = CAMPUS_ZONES.map(zone => `
                <button type="button" data-zone="${zone.id}" onclick="selectZone('${zone.id}')"
                    class="zone-card text-left p-3 rounded-2xl border border-slate-700/90 bg-slate-800/70 hover:bg-slate-800 transition active:scale-[0.98]">
                    <div class="flex items-center gap-2">
                        <span class="text-xl">${zone.icon}</span>
                        <span class="text-xs font-extrabold text-white leading-snug">${zone.name}</span>
                    </div>
                    <p class="text-[11px] text-slate-400 mt-1 truncate">${zone.sub}</p>
                </button>
            `).join('');
        }

        function selectZone(zoneId) {
            selectedZoneId = zoneId;
            updateZoneSelectionUI();
        }

        function updateZoneSelectionUI() {
            document.querySelectorAll('.zone-card').forEach(card => {
                const isSelected = card.dataset.zone === selectedZoneId;
                card.className = isSelected
                    ? 'zone-card text-left p-3 rounded-2xl border-2 border-red-500 bg-red-500/15 shadow-lg shadow-red-950/40 transition'
                    : 'zone-card text-left p-3 rounded-2xl border border-slate-700/90 bg-slate-800/70 hover:bg-slate-800 transition';
            });

            const submitBtn = document.getElementById('btn-submit-report');
            if (!selectedZoneId) {
                submitBtn.disabled = true;
                submitBtn.textContent = '請先選擇上方區域';
            } else {
                const zone = CAMPUS_ZONES.find(z => z.id === selectedZoneId);
                submitBtn.disabled = false;
                submitBtn.textContent = `🚨 確認發送「${zone.name}」警報`;
            }
        }

        function selectTag(btn, tagText) {
            selectedTag = tagText;
            document.querySelectorAll('.tag-btn').forEach(b => {
                b.className = 'tag-btn px-3 py-1.5 rounded-xl text-xs font-semibold border border-slate-700 bg-slate-800 text-slate-300 hover:border-slate-600 transition';
            });
            btn.className = 'tag-btn active px-3 py-1.5 rounded-xl text-xs font-semibold border border-red-500/60 bg-red-500/20 text-red-300 transition';
        }

        function submitReport() {
            if (!selectedZoneId) return;
            const now = Date.now();
            const zone = CAMPUS_ZONES.find(z => z.id === selectedZoneId);
            const note = document.getElementById('custom-note').value.trim();

            // Check 5-minute Anti-Spam Cooldown for the same active zone
            const existingActive = alerts.find(a =>
                a.zoneId === selectedZoneId &&
                a.status === 'active' &&
                (now - a.createdAt) < COOLDOWN_MS
            );

            closeReportModal();

            if (existingActive) {
                existingActive.confirmations += 1;
                if (note) existingActive.note = note;
                confirmedIds.add(existingActive.id);
                saveToStorage();
                renderAll();
                showToast(`🛡️ 該區 5 分鐘內已有警報！已自動為您「+1 確認目擊」避免洗版`);
                return;
            }

            // Create new broadcast alert
            const newAlert = {
                id: 'alert-' + now,
                zoneId: selectedZoneId,
                tag: selectedTag,
                note: note || `${zone.name}發現車管會拖吊車，請附近同學注意！`,
                createdAt: now,
                confirmations: 1,
                status: 'active'
            };

            alerts.unshift(newAlert);
            confirmedIds.add(newAlert.id);
            saveToStorage();
            renderAll();
            triggerVisualAndAudioAlert(zone, newAlert.note);
        }

        // ==========================================
        // 5. Alert Interactions (+1 Confirm, Mark Cleared, Simulate)
        // ==========================================
        function confirmSighting(alertId) {
            const alert = alerts.find(a => a.id === alertId);
            if (!alert || alert.status !== 'active') return;

            if (confirmedIds.has(alertId)) {
                showToast('👍 您已經確認過這則通報囉！');
                return;
            }

            alert.confirmations += 1;
            confirmedIds.add(alertId);
            saveToStorage();
            renderAlertFeed();
            showToast('✅ 已 +1 確認現場目擊，感謝回報！');
        }

        function markCleared(alertId) {
            const alert = alerts.find(a => a.id === alertId);
            if (!alert || alert.status !== 'active') return;

            alert.status = 'cleared';
            alert.clearedAt = Date.now();
            saveToStorage();
            renderAll();
            showToast('🟢 已回報「拖車已離開」，警報解除！');
        }

        function simulateIncomingAlert() {
            const availableZones = CAMPUS_ZONES.filter(z =>
                !alerts.some(a => a.zoneId === z.id && a.status === 'active')
            );
            const targetZone = availableZones.length > 0
                ? availableZones[Math.floor(Math.random() * availableZones.length)]
                : CAMPUS_ZONES[Math.floor(Math.random() * CAMPUS_ZONES.length)];

            const sampleNotes = [
                '拖車剛轉進來，正在看機慢車道違停！',
                '車管會人員下車開單了，快來移車！',
                '拖吊車閃黃燈慢速巡邏中，請注意安全'
            ];
            const note = sampleNotes[Math.floor(Math.random() * sampleNotes.length)];

            const incoming = {
                id: 'alert-sim-' + Date.now(),
                zoneId: targetZone.id,
                tag: '拖車巡邏移動中',
                note: note,
                createdAt: Date.now(),
                confirmations: 2,
                status: 'active'
            };

            alerts.unshift(incoming);
            saveToStorage();
            renderAll();
            triggerVisualAndAudioAlert(targetZone, note);
        }

        function triggerVisualAndAudioAlert(zone, note) {
            playEmergencyTone();

            // Screen border flash
            const shell = document.getElementById('app-shell');
            shell.classList.remove('animate-flash-red');
            void shell.offsetWidth; // trigger reflow
            shell.classList.add('animate-flash-red');

            // Top slide-down push banner
            const banner = document.getElementById('push-banner');
            document.getElementById('push-banner-title').textContent = `${zone.icon} ${zone.name} 發現拖吊車！`;
            document.getElementById('push-banner-desc').textContent = note;

            banner.classList.remove('opacity-0', '-translate-y-6');
            banner.classList.add('opacity-100', 'translate-y-0');

            setTimeout(() => {
                banner.classList.remove('opacity-100', 'translate-y-0');
                banner.classList.add('opacity-0', '-translate-y-6');
            }, 4200);

            // Native OS Notification if granted
            if ('Notification' in window && Notification.permission === 'granted') {
                new Notification(`🚨 中山拖吊警報：${zone.name}`, {
                    body: note
                });
            }
        }

        function checkAutoExpiration() {
            const now = Date.now();
            let changed = false;
            alerts.forEach(a => {
                if (a.status === 'active' && (now - a.createdAt) >= ALERT_TTL_MS) {
                    a.status = 'cleared';
                    a.clearedAt = now;
                    changed = true;
                }
            });
            if (changed) {
                saveToStorage();
                renderCampusMap();
                updateHeaderBadges();
            }
        }

        // ==========================================
        // 6. Rendering UI (Radar Map, Feed, Badges)
        // ==========================================
        function renderAll() {
            updateHeaderBadges();
            renderCampusMap();
            renderAlertFeed();
        }

        function updateHeaderBadges() {
            const activeCount = alerts.filter(a => a.status === 'active').length;
            const globalPill = document.getElementById('global-status-pill');
            const feedBadge = document.getElementById('active-count-badge');

            if (activeCount > 0) {
                globalPill.className = 'px-2 py-0.5 rounded-full bg-red-500/20 border border-red-500/40 text-red-400 font-bold text-[11px] animate-pulse';
                globalPill.textContent = `⚠️ 校內警戒中 (${activeCount} 處通報)`;
                feedBadge.className = 'px-2 py-0.5 rounded-full text-[11px] font-bold bg-red-500/20 text-red-400 border border-red-500/30';
                feedBadge.textContent = `${activeCount} 則進行中`;
            } else {
                globalPill.className = 'px-2 py-0.5 rounded-full bg-emerald-500/15 border border-emerald-500/30 text-emerald-400 font-bold text-[11px]';
                globalPill.textContent = '✅ 目前全校安全無拖吊';
                feedBadge.className = 'px-2 py-0.5 rounded-full text-[11px] font-bold bg-emerald-500/15 text-emerald-400 border border-emerald-500/30';
                feedBadge.textContent = '0 則進行中';
            }
        }

        function setZoneFilter(zoneId) {
            activeZoneFilter = (activeZoneFilter === zoneId) ? 'all' : zoneId;
            const resetBtn = document.getElementById('btn-reset-filter');
            resetBtn.classList.toggle('hidden', activeZoneFilter === 'all');
            renderCampusMap();
            renderAlertFeed();
        }

        function renderCampusMap() {
            const container = document.getElementById('map-hotspots');
            container.innerHTML = CAMPUS_ZONES.map(zone => {
                const isAlert = alerts.some(a => a.zoneId === zone.id && a.status === 'active');
                const isFiltered = activeZoneFilter === zone.id;
                const shortName = zone.name.split('/')[0].trim();

                return `
                    <g onclick="setZoneFilter('${zone.id}')" class="cursor-pointer">
                        ${isAlert ? `
                            <circle cx="${zone.x}" cy="${zone.y}" r="14" fill="#EF4444" opacity="0.35">
                                <animate attributeName="r" from="8" to="22" dur="1.4s" repeatCount="indefinite"/>
                                <animate attributeName="opacity" from="0.7" to="0" dur="1.4s" repeatCount="indefinite"/>
                            </circle>
                        ` : ''}
                        <circle cx="${zone.x}" cy="${zone.y}" r="${isFiltered ? 8 : 6.5}"
                            fill="${isAlert ? '#EF4444' : '#10B981'}"
                            stroke="${isFiltered ? '#FFFFFF' : '#0F172A'}"
                            stroke-width="2"/>
                        <rect x="${zone.x - 28}" y="${zone.y + 9}" width="56" height="14" rx="4"
                            fill="${isAlert ? '#7F1D1D' : '#1E293B'}" opacity="0.9"/>
                        <text x="${zone.x}" y="${zone.y + 19}" text-anchor="middle"
                            fill="${isAlert ? '#FCA5A5' : '#CBD5E1'}"
                            font-size="8.5" font-weight="700">
                            ${shortName}
                        </text>
                    </g>
                `;
            }).join('');
        }

        function renderAlertFeed() {
            const feedEl = document.getElementById('alert-feed');
            const now = Date.now();

            const filtered = activeZoneFilter === 'all'
                ? alerts
                : alerts.filter(a => a.zoneId === activeZoneFilter);

            if (filtered.length === 0) {
                feedEl.innerHTML = `
                    <div class="rounded-2xl border border-slate-800 bg-slate-800/30 p-8 text-center">
                        <div class="text-3xl mb-2">🛵</div>
                        <p class="text-sm font-bold text-slate-300">此區域目前沒有拖吊通報</p>
                        <p class="text-xs text-slate-500 mt-1">請大家依然遵守校內停車規定，停放於合法車格內</p>
                    </div>
                `;
                return;
            }

            feedEl.innerHTML = filtered.map(alert => {
                const zone = CAMPUS_ZONES.find(z => z.id === alert.zoneId) || CAMPUS_ZONES[0];
                const isActive = alert.status === 'active';
                const elapsedMin = Math.max(1, Math.floor((now - alert.createdAt) / 60000));
                const remainingMs = Math.max(0, ALERT_TTL_MS - (now - alert.createdAt));
                const remMin = Math.floor(remainingMs / 60000);
                const remSec = Math.floor((remainingMs % 60000) / 1000).toString().padStart(2, '0');
                const isConfirmedByMe = confirmedIds.has(alert.id);

                if (isActive) {
                    return `
                        <article class="rounded-2xl bg-gradient-to-b from-red-950/50 to-slate-800/90 border border-red-500/40 p-4 shadow-lg transition-all">
                            <div class="flex items-start justify-between gap-2">
                                <div class="flex items-center gap-2.5">
                                    <span class="w-10 h-10 rounded-xl bg-red-500/20 border border-red-500/30 flex items-center justify-center text-xl shrink-0">
                                        ${zone.icon}
                                    </span>
                                    <div>
                                        <div class="flex items-center gap-1.5 flex-wrap">
                                            <h4 class="text-sm font-black text-white">${zone.name}</h4>
                                            <span class="px-2 py-0.5 rounded-md bg-red-500/20 text-red-300 text-[10px] font-bold border border-red-500/30">
                                                ${alert.tag}
                                            </span>
                                        </div>
                                        <p class="text-[11px] text-slate-400 mt-0.5">${elapsedMin} 分鐘前通報 • 剩餘 ${remMin}:${remSec} 自動解除</p>
                                    </div>
                                </div>
                                <span class="flex h-2.5 w-2.5 shrink-0 mt-1">
                                    <span class="animate-ping absolute inline-flex h-2.5 w-2.5 rounded-full bg-red-400 opacity-75"></span>
                                    <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-red-500"></span>
                                </span>
                            </div>

                            <p class="mt-3 text-sm text-slate-100 bg-slate-950/50 rounded-xl px-3 py-2.5 border border-slate-800/80 leading-relaxed">
                                「${escapeHtml(alert.note)}」
                            </p>

                            <div class="mt-3 flex items-center gap-2">
                                <button onclick="confirmSighting('${alert.id}')"
                                    class="flex-1 py-2 px-3 rounded-xl text-xs font-extrabold flex items-center justify-center gap-1.5 transition active:scale-95
                                    ${isConfirmedByMe
                                        ? 'bg-amber-500/25 border border-amber-400/50 text-amber-200'
                                        : 'bg-slate-800 hover:bg-slate-700 border border-slate-600 text-white'}">
                                    <span>👀</span>
                                    <span>${isConfirmedByMe ? '已確認目擊' : '+1 我也看到了'} (${alert.confirmations})</span>
                                </button>
                                <button onclick="markCleared('${alert.id}')"
                                    class="py-2 px-3 rounded-xl bg-emerald-500/15 hover:bg-emerald-500/25 border border-emerald-500/40 text-emerald-300 text-xs font-bold flex items-center gap-1 transition active:scale-95">
                                    <span>✅ 拖車已離開</span>
                                </button>
                            </div>
                        </article>
                    `;
                } else {
                    return `
                        <article class="rounded-2xl bg-slate-800/40 border border-slate-800 p-3.5 opacity-75">
                            <div class="flex items-center justify-between gap-2">
                                <div class="flex items-center gap-2.5">
                                    <span class="w-9 h-9 rounded-xl bg-slate-800 flex items-center justify-center text-lg grayscale">
                                        ${zone.icon}
                                    </span>
                                    <div>
                                        <div class="flex items-center gap-2">
                                            <h4 class="text-xs font-bold text-slate-300">${zone.name}</h4>
                                            <span class="px-2 py-0.5 rounded-md bg-emerald-500/15 text-emerald-400 text-[10px] font-bold">
                                                已撤離 / 解除
                                            </span>
                                        </div>
                                        <p class="text-[11px] text-slate-500 mt-0.5">${elapsedMin} 分鐘前通報 • 累計 ${alert.confirmations} 人確認</p>
                                    </div>
                                </div>
                            </div>
                        </article>
                    `;
                }
            }).join('');
        }

        // ==========================================
        // 7. Utility Helpers
        // ==========================================
        let toastTimer = null;
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.remove('opacity-0', 'translate-y-2');
            toast.classList.add('opacity-100', 'translate-y-0');

            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'translate-y-2');
            }, 3000);
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        window.onload = init;
    </script>
</body>
</html>
