<!DOCTYPE html>
<html lang="zh-Hant" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0F172A">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>中山車管會拖吊警報器 | 西子灣即時互助系統 v1.5</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Noto Sans TC"', 'Inter', 'sans-serif'],
                    },
                    animation: {
                        'pulse-fast': 'pulse 1.2s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'radar-ping': 'radarPing 2s cubic-bezier(0, 0, 0.2, 1) infinite',
                        'slide-up': 'slideUp 0.25s ease-out forwards',
                        'flash-red': 'flashRed 0.6s ease-out',
                    },
                    keyframes: {
                        radarPing: {
                            '0%': { transform: 'scale(0.8)', opacity: '0.9' },
                            '75%, 100%': { transform: 'scale(2.4)', opacity: '0' },
                        },
                        slideUp: {
                            '0%': { transform: 'translateY(16px) scale(0.98)', opacity: '0' },
                            '100%': { transform: 'translateY(0) scale(1)', opacity: '1' },
                        },
                        flashRed: {
                            '0%, 100%': { boxShadow: 'inset 0 0 0 0 rgba(239, 68, 68, 0)' },
                            '50%': { boxShadow: 'inset 0 0 45px 12px rgba(239, 68, 68, 0.55)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #020617;
            color: #F8FAFC;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #0F172A;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 9999px;
        }
        .sos-glow {
            box-shadow: 0 0 30px rgba(239, 68, 68, 0.45), inset 0 2px 4px rgba(255, 255, 255, 0.3);
        }
        .sos-glow:active {
            transform: scale(0.97);
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.7);
        }
    </style>
</head>
<body class="min-h-screen flex justify-center bg-slate-950 font-sans antialiased">

    <!-- Mobile-First App Shell -->
    <div id="app-shell" class="w-full max-w-[480px] min-h-screen bg-slate-900 border-x border-slate-800/80 flex flex-col relative shadow-2xl overflow-x-hidden">

        <!-- Incoming Push Banner Notification -->
        <div id="push-banner" class="fixed top-3 left-1/2 -translate-x-1/2 w-[92%] max-w-[445px] z-50 pointer-events-none opacity-0 -translate-y-6 transition-all duration-300">
            <div class="bg-slate-800/95 backdrop-blur-md border border-red-500/60 rounded-2xl p-3.5 shadow-2xl flex items-start gap-3">
                <div class="w-10 h-10 rounded-xl bg-red-500/20 border border-red-500/40 flex items-center justify-center shrink-0 text-xl animate-bounce">
                    🚨
                </div>
                <div class="flex-1 min-w-0">
                    <div class="flex items-center justify-between gap-2">
                        <span class="text-xs font-bold text-red-400 tracking-wide uppercase">中山車管會緊急推播</span>
                        <span class="text-[11px] text-slate-400">剛剛</span>
                    </div>
                    <p id="push-banner-title" class="text-sm font-bold text-white truncate mt-0.5">工學院 / 電資大樓 發現拖吊車！</p>
                    <p id="push-banner-desc" class="text-xs text-slate-300 truncate mt-0.5">請停在紅線或機慢車道旁的同學儘速移車！</p>
                </div>
            </div>
        </div>

        <!-- Top Header & Live Status Bar -->
        <header class="sticky top-0 z-30 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 px-4 pt-3.5 pb-3">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-2.5">
                    <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-red-500 to-rose-700 flex items-center justify-center shadow-lg shadow-red-950/50">
                        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                        </svg>
                    </div>
                    <div>
                        <h1 class="text-base font-black tracking-tight text-white leading-tight flex items-center gap-1.5">
                            中山車管會拖吊警報器
                        </h1>
                        <p class="text-[11px] text-slate-400 font-medium">西子灣即時互助通報系統 v1.5</p>
                    </div>
                </div>

                <!-- Settings, Sound & LINE Status Controls -->
                <div class="flex items-center gap-1.5">
                    <button id="btn-webhook-settings" onclick="openWebhookModal()" title="LINE 推播與雲端同步設定" class="relative p-2 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 transition active:scale-95">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                        </svg>
                        <span id="webhook-dot" class="absolute -top-0.5 -right-0.5 w-2.5 h-2.5 rounded-full bg-emerald-400 border-2 border-slate-900"></span>
                    </button>

                    <button id="btn-sound-toggle" onclick="toggleSound()" title="切換警報音效" class="p-2 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-emerald-400 transition active:scale-95">
                        <svg id="icon-sound-on" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/>
                        </svg>
                        <svg id="icon-sound-off" class="w-4 h-4 hidden text-slate-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15zM17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2"/>
                        </svg>
                    </button>

                    <button id="btn-notify-toggle" onclick="requestNotificationPermission()" class="px-2.5 py-1.5 rounded-xl bg-emerald-500/15 hover:bg-emerald-500/25 border border-emerald-500/40 text-xs font-bold text-emerald-300 flex items-center gap-1.5 transition active:scale-95">
                        <span id="notify-dot" class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                        <span id="notify-label">LINE 推播就緒</span>
                    </button>
                </div>
            </div>

            <!-- Live Cloud Sync & Campus Status Bar -->
            <div class="mt-2.5 pt-2 border-t border-slate-800/80 flex items-center justify-between text-xs">
                <div id="sync-status-wrapper" class="flex items-center gap-1.5 text-emerald-400 font-medium">
                    <span class="relative flex h-2 w-2">
                        <span id="sync-ping" class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                        <span id="sync-dot" class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
                    </span>
                    <span id="sync-status-text">連線待命・通報直發 LINE</span>
                </div>
                <div id="global-status-pill" class="px-2 py-0.5 rounded-full bg-emerald-500/15 border border-emerald-500/30 text-emerald-400 font-bold text-[11px]">
                    ✅ 目前全校安全無拖吊
                </div>
            </div>
        </header>

        <!-- Main Scrollable Content -->
        <main class="flex-1 px-4 py-4 space-y-5 pb-10">

            <!-- Primary One-Tap Emergency Button -->
            <section aria-label="一鍵通報按鈕">
                <button onclick="openReportModal()" class="w-full relative group overflow-hidden rounded-2xl bg-gradient-to-r from-red-600 via-rose-600 to-red-600 p-4 text-white sos-glow transition-all duration-150 border border-red-400/40">
                    <div class="absolute inset-0 bg-[radial-gradient(circle_at_top_right,rgba(255,255,255,0.22),transparent_60%)]"></div>
                    <div class="relative flex items-center justify-between">
                        <div class="flex items-center gap-3.5 text-left">
                            <div class="w-12 h-12 rounded-2xl bg-white/15 backdrop-blur-sm border border-white/25 flex items-center justify-center text-3xl shrink-0">
                                🚨
                            </div>
                            <div>
                                <div class="inline-flex items-center gap-1 px-2 py-0.5 rounded-md bg-black/25 text-[11px] font-bold tracking-wider uppercase mb-1">
                                    <span>SOS 緊急廣播</span>
                                </div>
                                <h2 class="text-xl font-black tracking-tight leading-none">發現拖吊車！立即通報</h2>
                                <p class="text-xs text-red-100 mt-1 font-medium">點擊選擇校內區域，一秒通知全校同學</p>
                            </div>
                        </div>
                        <div class="w-9 h-9 rounded-full bg-white/20 flex items-center justify-center shrink-0 group-hover:translate-x-0.5 transition-transform">
                            <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/>
                            </svg>
                        </div>
                    </div>
                </button>
            </section>

            <!-- Interactive NSYSU Campus Radar Map -->
            <section class="bg-slate-800/50 border border-slate-700/70 rounded-2xl p-3.5">
                <div class="flex items-center justify-between mb-2.5">
                    <div class="flex items-center gap-1.5">
                        <span class="text-sm">🗺️</span>
                        <h3 class="text-xs font-bold text-slate-200 tracking-wide uppercase">西子灣校區即時熱點雷達</h3>
                    </div>
                    <button id="btn-reset-filter" onclick="setZoneFilter('all')" class="text-[11px] text-sky-400 hover:text-sky-300 font-semibold hidden">
                        顯示全部區域
                    </button>
                </div>

                <!-- Stylized Interactive SVG Map of NSYSU -->
                <div class="relative w-full h-44 rounded-xl bg-slate-950 border border-slate-800 overflow-hidden select-none">
                    <svg viewBox="0 0 400 180" class="w-full h-full">
                        <path d="M0,0 L125,0 C110,45 95,90 120,135 C135,160 175,168 230,180 L0,180 Z" fill="#0C2D48" opacity="0.75"/>
                        <text x="24" y="155" fill="#38BDF8" opacity="0.45" font-size="10" font-weight="700" letter-spacing="1">台灣海峽 / 西子灣海域</text>

                        <path d="M125,0 L400,0 L400,180 L230,180 C175,168 135,160 120,135 C95,90 110,45 125,0 Z" fill="#0F172A"/>
                        <path d="M240,10 Q320,40 380,15" stroke="#1E293B" stroke-width="1.5" fill="none"/>
                        <path d="M260,35 Q335,70 395,45" stroke="#1E293B" stroke-width="1.5" fill="none"/>
                        <text x="315" y="25" fill="#475569" font-size="9" font-weight="600">柴山山脈</text>

                        <path d="M115,125 Q165,148 245,142 T365,120" stroke="#334155" stroke-width="4" fill="none" stroke-linecap="round"/>
                        <path d="M245,142 L265,75 L335,55" stroke="#334155" stroke-width="3" fill="none" stroke-linecap="round"/>
                        <path d="M115,125 L135,45" stroke="#334155" stroke-width="3" fill="none" stroke-linecap="round"/>

                        <g id="map-hotspots"></g>
                    </svg>
                    <div class="absolute bottom-2 right-2.5 flex items-center gap-2.5 bg-slate-900/85 backdrop-blur-sm px-2 py-1 rounded-lg border border-slate-800 text-[10px] text-slate-300">
                        <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></span>拖吊警戒</span>
                        <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-emerald-500"></span>安全無虞</span>
                    </div>
                </div>
            </section>

            <!-- Live Alert Feed Section -->
            <section class="space-y-3">
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-2">
                        <h3 class="text-sm font-extrabold text-white tracking-tight">即時通報動態</h3>
                        <span id="active-count-badge" class="px-2 py-0.5 rounded-full text-[11px] font-bold bg-emerald-500/15 text-emerald-400 border border-emerald-500/30">0 則進行中</span>
                    </div>
                    <button onclick="fetchCloudAlerts(true)" class="px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-[11px] font-bold text-slate-200 flex items-center gap-1 transition active:scale-95">
                        <span>🔄 立即更新</span>
                    </button>
                </div>

                <!-- Alert Cards Container -->
                <div id="alert-feed" class="space-y-3"></div>
            </section>

        </main>

        <!-- Quick-Select Report Modal (Centered on All Screens) -->
        <div id="report-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4">
            <div onclick="closeReportModal()" class="fixed inset-0 bg-black/75 backdrop-blur-sm transition-opacity"></div>

            <div class="relative z-10 w-full max-w-[440px] bg-slate-900 border border-slate-700 rounded-3xl p-5 shadow-2xl animate-slide-up max-h-[90vh] overflow-y-auto">
                <div class="flex items-center justify-between mb-3">
                    <div>
                        <h2 class="text-lg font-black text-white flex items-center gap-2">
                            <span>🚨 選擇發現拖吊車位置</span>
                        </h2>
                        <p class="text-xs text-slate-400 mt-0.5">點擊區域即可同步推播至全校與 LINE 機器人</p>
                    </div>
                    <button onclick="closeReportModal()" class="w-8 h-8 rounded-full bg-slate-800 text-slate-400 hover:text-white flex items-center justify-center">
                        ✕
                    </button>
                </div>

                <!-- Hotspot Grid -->
                <div id="zone-grid" class="grid grid-cols-2 gap-2.5 my-3"></div>

                <!-- Quick Urgency Tags -->
                <div class="mt-4">
                    <label class="block text-xs font-bold text-slate-300 mb-2">現場狀況快選（選填）</label>
                    <div id="tag-selector" class="flex flex-wrap gap-2">
                        <button type="button" onclick="selectTag(this, '拖車巡邏移動中')" class="tag-btn active px-3 py-1.5 rounded-xl text-xs font-semibold border border-red-500/60 bg-red-500/20 text-red-300 transition">
                            🚛 拖車巡邏移動中
                        </button>
                        <button type="button" onclick="selectTag(this, '正在開單 / 準備上夾')" class="tag-btn px-3 py-1.5 rounded-xl text-xs font-semibold border border-slate-700 bg-slate-800 text-slate-300 hover:border-slate-600 transition">
                            📸 正在開單 / 準備上夾
                        </button>
                        <button type="button" onclick="selectTag(this, '貨車式吊車出沒')" class="tag-btn px-3 py-1.5 rounded-xl text-xs font-semibold border border-slate-700 bg-slate-800 text-slate-300 hover:border-slate-600 transition">
                            🏗️ 貨車式吊車出沒
                        </button>
                    </div>
                </div>

                <!-- Optional Short Note -->
                <div class="mt-3.5">
                    <input id="custom-note" type="text" maxlength="40" placeholder="補充說明（例如：往海堤方向開過去了...）" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-950 border border-slate-700 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-red-500">
                </div>

                <!-- Submit Action -->
                <button id="btn-submit-report" onclick="submitReport()" class="w-full mt-4 py-3.5 rounded-2xl bg-red-600 hover:bg-red-500 disabled:opacity-40 disabled:cursor-not-allowed text-white font-black text-base shadow-lg shadow-red-950/60 transition active:scale-[0.98]">
                    請先選擇上方區域
                </button>
            </div>
        </div>

        <!-- LINE Webhook & Cloud Relay Settings Modal (Centered on All Screens) -->
        <div id="webhook-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4">
            <div onclick="closeWebhookModal()" class="fixed inset-0 bg-black/75 backdrop-blur-sm transition-opacity"></div>

            <div class="relative z-10 w-full max-w-[440px] bg-slate-900 border border-slate-700 rounded-3xl p-5 shadow-2xl animate-slide-up max-h-[90vh] overflow-y-auto">
                <div class="flex items-center justify-between mb-3">
                    <div>
                        <h2 class="text-lg font-black text-white flex items-center gap-2">
                            <span>🔗 LINE 推播與雲端中繼站</span>
                        </h2>
                        <p class="text-xs text-slate-400 mt-0.5">已內建預設 Google Apps Script 網址，可在此測試推播</p>
                    </div>
                    <button onclick="closeWebhookModal()" class="w-8 h-8 rounded-full bg-slate-800 text-slate-400 hover:text-white flex items-center justify-center">
                        ✕
                    </button>
                </div>

                <div class="space-y-3 my-3">
                    <div>
                        <label class="block text-xs font-bold text-slate-300 mb-1.5">Google Apps Script 網頁應用程式網址</label>
                        <input id="webhook-url-input" type="url" placeholder="https://script.google.com/macros/s/...../exec" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-950 border border-slate-700 text-xs text-white font-mono placeholder-slate-500 focus:outline-none focus:border-emerald-500">
                    </div>

                    <div id="webhook-current-status" class="p-3 rounded-xl bg-slate-950/80 border border-slate-800 text-xs">
                        <p class="font-bold text-emerald-400">✅ 已連線至 LINE 與雲端資料庫</p>
                        <p id="webhook-url-preview" class="text-[11px] text-slate-400 font-mono break-all mt-1"></p>
                    </div>
                </div>

                <div class="grid grid-cols-3 gap-2 mt-4">
                    <button type="button" onclick="testLineWebhook()" class="py-2.5 px-2 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-600 text-slate-200 font-bold text-xs transition active:scale-[0.98]">
                        📡 發送測試推播
                    </button>
                    <button type="button" onclick="resetWebhookUrl()" class="py-2.5 px-2 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-600 text-amber-300 font-bold text-xs transition active:scale-[0.98]">
                        🔄 恢復預設
                    </button>
                    <button type="button" onclick="saveWebhookUrl()" class="py-2.5 px-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-black text-xs shadow-lg shadow-emerald-950/60 transition active:scale-[0.98]">
                        💾 儲存網址
                    </button>
                </div>
            </div>
        </div>

        <!-- Toast Feedback Message -->
        <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 px-4 py-2.5 rounded-xl bg-slate-800 border border-slate-600 text-white text-xs font-bold shadow-2xl opacity-0 pointer-events-none transition-all duration-200 whitespace-nowrap max-w-[92vw] truncate">
        </div>

    </div>

    <script>
        // ==========================================
        // 1. Google Apps Script Backend & LINE Webhook Configuration
        // ==========================================
        const DEFAULT_GAS_LINE_WEBHOOK_URL = 'https://script.google.com/macros/s/AKfycbxaRaqvLRElU5cHWvdHWMuya1HWPrU8y8h6F8R6oDycev7UuxiwqZ1HE_YH7Mixe7c/exec';

        const STALE_WEBHOOK_IDS = [
            'AKfycbw5Tjn_oYENKrN54V281Oj59ruScKiEmpoocHEFLdIgjGw2fmC5ezHJNH6LIhXuFHinjw',
            'AKfycbxvyC7YU9gR6CjkOgwLdM-C9-oMSV2LJIqZgO9bJvcuaF__kogTHz5Gh-3ZjerzMboUjg',
            'AKfycbxY-v9w1ZchSox5BEWrhJ1sFhKHUGCexMZ7_I2M2IkwjR2o41UEeQN7H9V6-P8l_VsgkA',
            'AKfycbz1eGSkQ2ZM97hAljPD1TRpbslu6efX8zkErWX25P8FGaUQMzKe3PeQPjAc51n68QQ3Lg',
            'AKfycby6FxCT2UrSsrn41CpK0mScJ7U91kb-jMGxxx4JQKtEB29d5W3K5PFQV7vtWdi_zHYpyA',
            'AKfycbyv0nKZVtDVrhrVefbpb0728EnRBdpPOjLZTvCGuAXu6qfsqWS9VJ5-G4zcTbZ_tvFJ_g',
            'AKfycbx75W91fxrn0TUOMhpLPjnqeqgSgsKtamq3h7M8UDX0MjH_aJONtKxlEz-odaDwp02sDQ'

        const STORAGE_KEY_ALERTS = 'nsysu_towing_alerts_v1_5';

        // ==========================================
        // 2. Initialization & Cloud Sync
        // ==========================================
        function getWebhookUrl() {
            let saved = (localStorage.getItem(STORAGE_KEY_WEBHOOK) || '').trim();
            if (!saved || STALE_WEBHOOK_IDS.some(staleId => saved.includes(staleId))) {
                localStorage.setItem(STORAGE_KEY_WEBHOOK, DEFAULT_GAS_LINE_WEBHOOK_URL);
                return DEFAULT_GAS_LINE_WEBHOOK_URL;
            }
            return saved;
        }

        function init() {
            getWebhookUrl();
            loadConfirmedIds();
            loadFromStorage();
            renderZoneSelector();
            renderAll();

            fetchCloudAlerts(false);
            setInterval(() => fetchCloudAlerts(false), 10000);

            setInterval(() => {
                checkAutoExpiration();
                renderAlertFeed();
            }, 1000);
        }

        function loadConfirmedIds() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY_CONFIRMED);
                if (raw) confirmedIds = new Set(JSON.parse(raw));
            } catch (e) {}
        }

        function saveConfirmedIds() {
            try {
                localStorage.setItem(STORAGE_KEY_CONFIRMED, JSON.stringify([...confirmedIds]));
            } catch (e) {}
        }

        function loadFromStorage() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY_ALERTS);
                if (saved) {
                    alerts = JSON.parse(saved);
                    return;
                }
            } catch (e) {}
            alerts = [];
        }

        function saveToStorage() {
            try {
                localStorage.setItem(STORAGE_KEY_ALERTS, JSON.stringify(alerts));
            } catch (e) {}
        }

        async function fetchCloudAlerts(isManual = false) {
            const url = getWebhookUrl();
            if (!url) return;

            try {
                const sep = url.includes('?') ? '&' : '?';
                const res = await fetch(`${url}${sep}action=list&t=${Date.now()}`, {
                    method: 'GET',
                    redirect: 'follow',
                    cache: 'no-store'
                });
                const text = await res.text();
                const data = JSON.parse(text);

                if (data && data.ok && Array.isArray(data.alerts)) {
                    applyCloudAlertsData(data.alerts);
                    updateSyncStatusUI(true);
                    if (isManual) showToast('✅ 已與雲端資料庫完成即時同步');
                } else {
                    updateSyncStatusUI(false);
                    if (isManual) showToast('⚠️ 雲端回傳格式異常，請檢查 GAS 部署');
                }
            } catch (err) {
                updateSyncStatusUI(false);
                if (isManual) showToast('⚠️ 尚未讀取到雲端資料（請確認 GAS 部署權限為所有人）');
            }
        }

        function applyCloudAlertsData(cloudAlerts) {
            const prevActiveIds = new Set(alerts.filter(a => a.status === 'active').map(a => a.id));

            alerts = cloudAlerts.map(item => ({
                id: String(item.id),
                zoneId: String(item.zoneId),
                tag: String(item.tag || '拖車巡邏移動中'),
                note: String(item.note || ''),
                createdAt: Number(item.createdAt) || Date.now(),
                clearedAt: item.clearedAt ? Number(item.clearedAt) : null,
                confirmations: Math.max(1, Number(item.confirmations) || 1),
                status: item.status === 'cleared' ? 'cleared' : 'active'
            }));

            saveToStorage();
            renderAll();

            const newestActive = alerts.find(a => a.status === 'active');
            if (newestActive && !prevActiveIds.has(newestActive.id) && lastAnnouncedAlertId !== null && newestActive.id !== lastAnnouncedAlertId) {
                const zone = CAMPUS_ZONES.find(z => z.id === newestActive.zoneId) || CAMPUS_ZONES[0];
                triggerVisualAndAudioAlert(zone, newestActive.note);
            }
            if (newestActive) {
                lastAnnouncedAlertId = newestActive.id;
            } else if (lastAnnouncedAlertId === null) {
                lastAnnouncedAlertId = 'none';
            }
        }

        function updateSyncStatusUI(isConnected) {
            const wrapper = document.getElementById('sync-status-wrapper');
            const ping = document.getElementById('sync-ping');
            const dot = document.getElementById('sync-dot');
            const text = document.getElementById('sync-status-text');

            if (isConnected) {
                wrapper.className = 'flex items-center gap-1.5 text-emerald-400 font-medium';
                ping.className = 'animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75';
                dot.className = 'relative inline-flex rounded-full h-2 w-2 bg-emerald-500';
                text.textContent = '雲端即時同步中・通報直發 LINE';
            } else {
                wrapper.className = 'flex items-center gap-1.5 text-amber-400 font-medium';
                ping.className = 'animate-ping absolute inline-flex h-full w-full rounded-full bg-amber-400 opacity-75';
                dot.className = 'relative inline-flex rounded-full h-2 w-2 bg-amber-500';
                text.textContent = '連線待命・通報直發 LINE';
            }
        }

        async function sendPayloadToGas(payload) {
            const url = getWebhookUrl();
            if (!url) return { ok: false };

            const params = new URLSearchParams();
            Object.entries(payload).forEach(([k, v]) => {
                if (v !== undefined && v !== null) params.append(k, String(v));
            });
            params.append('t', String(Date.now()));

            const sep = url.includes('?') ? '&' : '?';
            const res = await fetch(`${url}${sep}${params.toString()}`, {
                method: 'GET',
                redirect: 'follow',
                cache: 'no-store'
            });
            const text = await res.text();
            const data = JSON.parse(text);
            if (data && Array.isArray(data.alerts)) {
                applyCloudAlertsData(data.alerts);
                updateSyncStatusUI(true);
            }
            return data;
        }

        // ==========================================
        // 3. Web Audio API & Notifications
        // ==========================================
        function playEmergencyTone() {
            if (!soundEnabled) return;
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                const ctx = new AudioCtx();
                const now = ctx.currentTime;

                const freqs = [880, 659.25, 987.77];
                freqs.forEach((freq, idx) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, now + idx * 0.14);

                    gain.gain.setValueAtTime(0.001, now + idx * 0.14);
                    gain.gain.exponentialRampToValueAtTime(0.25, now + idx * 0.14 + 0.03);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.14 + 0.13);

                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now + idx * 0.14);
                    osc.stop(now + idx * 0.14 + 0.14);
                });
            } catch (e) {}
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            document.getElementById('icon-sound-on').classList.toggle('hidden', !soundEnabled);
            document.getElementById('icon-sound-off').classList.toggle('hidden', soundEnabled);
            showToast(soundEnabled ? '🔊 已開啟警報提示音效' : '🔇 已靜音警報提示音效');
            if (soundEnabled) playEmergencyTone();
        }

            const dot = document.getElementById('notify-dot');

            if (!('Notification' in window)) {

        async function submitReport() {
            if (!selectedZoneId || isSubmitting) return;
            isSubmitting = true;

            const now = Date.now();
            const zone = CAMPUS_ZONES.find(z => z.id === selectedZoneId);
            const rawNote = document.getElementById('custom-note').value.trim();
            const finalNote = rawNote
                ? `${selectedTag}：${rawNote}`
                : `${selectedTag} — ${zone.name}發現車管會拖吊車，請附近同學注意！`;

            const submitBtn = document.getElementById('btn-submit-report');
            submitBtn.disabled = true;
            submitBtn.textContent = '⏳ 正在同步雲端並發送 LINE...';

            const existingActive = alerts.find(a =>
                a.zoneId === selectedZoneId &&
                a.status === 'active' &&
                (now - a.createdAt) < COOLDOWN_MS
            );

            if (existingActive) {
                existingActive.confirmations += 1;
                if (rawNote) existingActive.note = finalNote;
                confirmedIds.add(existingActive.id);
            } else {
                const optimisticAlert = {
                    id: 'alert-' + now,
                    zoneId: selectedZoneId,
                    tag: selectedTag,
                    note: finalNote,
                    createdAt: now,
                    confirmations: 1,
                    status: 'active'
                };
                alerts.unshift(optimisticAlert);
                confirmedIds.add(optimisticAlert.id);
            }

            saveConfirmedIds();
            saveToStorage();
            closeReportModal();
            renderAll();
            triggerVisualAndAudioAlert(zone, finalNote);

            try {
                const res = await sendPayloadToGas({
                    action: 'report',
                    area: zone.name,
                    zoneId: zone.id,
                    tag: selectedTag,
                    note: finalNote
                });

                if (res && res.ok) {
                    if (res.merged) {
                        showToast(`🛡️ 該區 5 分鐘內已有警報！已自動為您「+1 確認目擊」`);
                    } else if (res.lineOk === false) {
                        showToast(`⚠️ 雲端已同步，但 LINE 回傳錯誤 (${res.lineStatus || 'Token'})`);
                    } else {
                        showToast(`🚨 已通報「${zone.name}」並成功推播至 LINE！`);
                    }
                } else {
                    showToast('⚠️ 雲端或 LINE 傳送失敗，請檢查 GAS 部署設定');
                }
            } catch (e) {
                showToast('⚠️ 網路傳送失敗，請檢查連線後再試');
            } finally {
                isSubmitting = false;
                updateZoneSelectionUI();
            }
        }

        // ==========================================
        // 5. Alert Interactions (+1 Confirm, Mark Cleared)
        // ==========================================
        async function confirmSighting(alertId) {
            const alert = alerts.find(a => a.id === alertId);
            if (!alert || alert.status !== 'active') return;

            if (confirmedIds.has(alertId)) {
                showToast('👍 您已經確認過這則通報囉！');
                return;
            }

            alert.confirmations += 1;
            confirmedIds.add(alertId);
            saveConfirmedIds();
            saveToStorage();
            renderAlertFeed();
            showToast('✅ 已 +1 確認現場目擊，正在同步雲端...');

            try {
                await sendPayloadToGas({
                    action: 'confirm',
                    alertId: alertId
                });
            } catch (e) {}
        }

        async function markCleared(alertId) {
            const alert = alerts.find(a => a.id === alertId);
            if (!alert || alert.status !== 'active') return;

            const zone = CAMPUS_ZONES.find(z => z.id === alert.zoneId) || CAMPUS_ZONES[0];
            alert.status = 'cleared';
            alert.clearedAt = Date.now();
            saveToStorage();
            renderAll();
            showToast('🟢 正在回報「拖車已離開」並推播解除通知...');

            try {
                const res = await sendPayloadToGas({
                    action: 'cleared',
                    alertId: alertId,
                    area: zone.name,
                    note: '同學回報拖吊車已離開現場，解除警戒'
                });
                if (res && res.ok) {
                    showToast('✅ 已解除警戒並推播通知全校 LINE！');
                }
            } catch (e) {}
        }

        // ==========================================
        // 7. Visual Alerts, Auto-Expiration & Rendering
        // ==========================================
        function triggerVisualAndAudioAlert(zone, note) {
            playEmergencyTone();

            const shell = document.getElementById('app-shell');
            shell.classList.remove('animate-flash-red');
            void shell.offsetWidth;
            shell.classList.add('animate-flash-red');

            const banner = document.getElementById('push-banner');
            document.getElementById('push-banner-title').textContent = `${zone.icon} ${zone.name} 發現拖吊車！`;
            document.getElementById('push-banner-desc').textContent = note;

            banner.classList.remove('opacity-0', '-translate-y-6');
            banner.classList.add('opacity-100', 'translate-y-0');

            setTimeout(() => {
                banner.classList.remove('opacity-100', 'translate-y-0');
                banner.classList.add('opacity-0', '-translate-y-6');
            }, 4200);

            if ('Notification' in window && Notification.permission === 'granted') {
                new Notification(`🚨 中山拖吊警報：${zone.name}`, { body: note });
            }
        }

        function checkAutoExpiration() {
            const now = Date.now();
            let changed = false;
            alerts.forEach(a => {
                if (a.status === 'active' && (now - a.createdAt) >= ALERT_TTL_MS) {
                    a.status = 'cleared';
                    a.clearedAt = now;
                    changed = true;
                }
            });
            if (changed) {
                saveToStorage();
                renderCampusMap();
                updateHeaderBadges();
            }
        }

        function renderAll() {
            updateHeaderBadges();
            renderCampusMap();
            renderAlertFeed();
        }

        function updateHeaderBadges() {
            const activeCount = alerts.filter(a => a.status === 'active').length;
            const globalPill = document.getElementById('global-status-pill');
            const feedBadge = document.getElementById('active-count-badge');

            if (activeCount > 0) {
                globalPill.className = 'px-2 py-0.5 rounded-full bg-red-500/20 border border-red-500/40 text-red-400 font-bold text-[11px] animate-pulse';
                globalPill.textContent = `⚠️ 校內警戒中 (${activeCount} 處通報)`;
                feedBadge.className = 'px-2 py-0.5 rounded-full text-[11px] font-bold bg-red-500/20 text-red-400 border border-red-500/30';
                feedBadge.textContent = `${activeCount} 則進行中`;
            } else {
                globalPill.className = 'px-2 py-0.5 rounded-full bg-emerald-500/15 border border-emerald-500/30 text-emerald-400 font-bold text-[11px]';
                globalPill.textContent = '✅ 目前全校安全無拖吊';
                feedBadge.className = 'px-2 py-0.5 rounded-full text-[11px] font-bold bg-emerald-500/15 text-emerald-400 border border-emerald-500/30';
                feedBadge.textContent = '0 則進行中';
            }
        }

            resetBtn.classList.toggle('hidden', activeZoneFilter === 'all');
            renderCampusMap();
            renderAlertFeed();

                            stroke-width="2"/>

                            fill="${isAlert ? '#FCA5A5' : '#CBD5E1'}"
                            font-size="8.5" font-weight="700">
                            ${shortName}
                        </text>
                    </g>
                `;
            }).join('');
        }

        function renderAlertFeed() {
            const feedEl = document.getElementById('alert-feed');
            const now = Date.now();

            const filtered = activeZoneFilter === 'all'
                ? alerts
                : alerts.filter(a => a.zoneId === activeZoneFilter);

            if (filtered.length === 0) {
                feedEl.innerHTML = `
                    <div class="rounded-2xl border border-slate-800 bg-slate-800/30 p-8 text-center">
                        <div class="text-3xl mb-2">🛵</div>
                        <p class="text-sm font-bold text-slate-300">目前尚無進行中的拖吊通報</p>
                        <p class="text-xs text-slate-500 mt-1">若在西子灣校區發現車管會拖吊車，點擊上方紅色按鈕即可即時通報</p>
                    </div>
                `;
                return;
            }

            feedEl.innerHTML = filtered.map(alert => {
                const zone = CAMPUS_ZONES.find(z => z.id === alert.zoneId) || CAMPUS_ZONES[0];
                const isActive = alert.status === 'active';
                const elapsedMin = Math.max(1, Math.floor((now - alert.createdAt) / 60000));
                const remainingMs = Math.max(0, ALERT_TTL_MS - (now - alert.createdAt));
                const remMin = Math.floor(remainingMs / 60000);
                const remSec = Math.floor((remainingMs % 60000) / 1000).toString().padStart(2, '0');
                const isConfirmedByMe = confirmedIds.has(alert.id);

                if (isActive) {
                    return `
                        <article class="rounded-2xl bg-gradient-to-b from-red-950/50 to-slate-800/90 border border-red-500/40 p-4 shadow-lg transition-all">
                            <div class="flex items-start justify-between gap-2">
                                <div class="flex items-center gap-2.5">
                                    <span class="w-10 h-10 rounded-xl bg-red-500/20 border border-red-500/30 flex items-center justify-center text-xl shrink-0">
                                        ${zone.icon}
                                    </span>
                                    <div>
                                        <div class="flex items-center gap-1.5 flex-wrap">
                                            <h4 class="text-sm font-black text-white">${zone.name}</h4>
                                            <span class="px-2 py-0.5 rounded-md bg-red-500/20 text-red-300 text-[10px] font-bold border border-red-500/30">
                                                ${escapeHtml(alert.tag)}
                                            </span>
                                        </div>
                                        <p class="text-[11px] text-slate-400 mt-0.5">${elapsedMin} 分鐘前通報 • 剩餘 ${remMin}:${remSec} 自動解除</p>
                                    </div>
                                </div>
                                <span class="flex h-2.5 w-2.5 shrink-0 mt-1">
                                    <span class="animate-ping absolute inline-flex h-2.5 w-2.5 rounded-full bg-red-400 opacity-75"></span>
                                    <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-red-500"></span>
                                </span>
                            </div>

                            <p class="mt-3 text-sm text-slate-100 bg-slate-950/50 rounded-xl px-3 py-2.5 border border-slate-800/80 leading-relaxed">
                                「${escapeHtml(alert.note)}」
                            </p>

                            <div class="mt-3 flex items-center gap-2">
                                <button onclick="confirmSighting('${alert.id}')"
                                    class="flex-1 py-2 px-3 rounded-xl text-xs font-extrabold flex items-center justify-center gap-1.5 transition active:scale-95
                                    ${isConfirmedByMe
                                        ? 'bg-amber-500/25 border border-amber-400/50 text-amber-200'
                                        : 'bg-slate-800 hover:bg-slate-700 border border-slate-600 text-white'}">
                                    <span>👀</span>
                                    <span>${isConfirmedByMe ? '已確認目擊' : '+1 我也看到了'} (${alert.confirmations})</span>
                                </button>
                                <button onclick="markCleared('${alert.id}')"
                                    class="py-2 px-3 rounded-xl bg-emerald-500/15 hover:bg-emerald-500/25 border border-emerald-500/40 text-emerald-300 text-xs font-bold flex items-center gap-1 transition active:scale-95">
                                    <span>✅ 拖車已離開</span>
                                </button>
                            </div>
                        </article>
                    `;
                } else {
                    return `
                        <article class="rounded-2xl bg-slate-800/40 border border-slate-800 p-3.5 opacity-75">
                            <div class="flex items-center justify-between gap-2">
                                <div class="flex items-center gap-2.5">
                                    <span class="w-9 h-9 rounded-xl bg-slate-800 flex items-center justify-center text-lg grayscale">
                                        ${zone.icon}
                                    </span>
                                    <div>
                                        <div class="flex items-center gap-2">
                                            <h4 class="text-xs font-bold text-slate-300">${zone.name}</h4>
                                            <span class="px-2 py-0.5 rounded-md bg-emerald-500/15 text-emerald-400 text-[10px] font-bold">
                                                已撤離 / 解除
                                            </span>
                                        </div>
                                        <p class="text-[11px] text-slate-500 mt-0.5">${elapsedMin} 分鐘前通報 • 累計 ${alert.confirmations} 人確認</p>
                                    </div>
                                </div>
                            </div>
                        </article>
                    `;
                }
            }).join('');
        }

        // ==========================================
        // 8. Utility Helpers
        // ==========================================
        let toastTimer = null;
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.remove('opacity-0', 'translate-y-2');
            toast.classList.add('opacity-100', 'translate-y-0');

            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'translate-y-2');
            }, 3000);
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        window.onload = init;
    </script>
</body>
</html>
