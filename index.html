<!DOCTYPE html>
<html lang="zh-Hant" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0F172A">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>中山車管會拖吊警報器｜西子灣即時互助系統 v1.6</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <script>
        // Configure Tailwind CSS dark mode, custom fonts, and alert/modal animations
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Noto Sans TC"', 'Inter', 'sans-serif'],
                    },
                    animation: {
                        'pulse-fast': 'pulse 1.2s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'radar-ping': 'radarPing 2s cubic-bezier(0, 0, 0.2, 1) infinite',
                        'slide-up': 'slideUp 0.22s ease-out forwards',
                        'flash-red': 'flashRed 0.6s ease-out',
                    },
                    keyframes: {
                        radarPing: {
                            '0%': { transform: 'scale(0.85)', opacity: '0.95' },
                            '75%, 100%': { transform: 'scale(2.3)', opacity: '0' },
                        },
                        slideUp: {
                            '0%': { transform: 'translateY(16px) scale(0.98)', opacity: '0' },
                            '100%': { transform: 'translateY(0) scale(1)', opacity: '1' },
                        },
                        flashRed: {
                            '0%, 100%': { boxShadow: 'inset 0 0 0 0 rgba(239, 68, 68, 0)' },
                            '50%': { boxShadow: 'inset 0 0 45px 12px rgba(239, 68, 68, 0.55)' },
                        }
                    }
                }
            }
        };
    </script>
    <style>
        body {
            background-color: #020617;
            color: #F8FAFC;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #0F172A;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 9999px;
        }
        .sos-glow {
            box-shadow: 0 0 30px rgba(239, 68, 68, 0.45), inset 0 2px 4px rgba(255, 255, 255, 0.3);
        }
        .sos-glow:active {
            transform: scale(0.97);
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.7);
        }
    </style>
</head>
<body class="min-h-screen flex justify-center bg-slate-950 font-sans antialiased">

    <!-- Mobile-First App Container -->
    <div id="app-shell" class="w-full max-w-[480px] min-h-screen bg-slate-900 border-x border-slate-800/80 flex flex-col relative shadow-2xl overflow-x-hidden">

        <!-- Incoming Push Banner Notification -->
        <div id="push-banner" class="fixed top-3 left-1/2 -translate-x-1/2 w-[92%] max-w-[445px] z-50 pointer-events-none opacity-0 -translate-y-6 transition-all duration-300">
            <div class="bg-slate-800/95 backdrop-blur-md border border-red-500/60 rounded-2xl p-3.5 shadow-2xl flex items-start gap-3">
                <div class="w-10 h-10 rounded-xl bg-red-500/20 border border-red-500/40 flex items-center justify-center shrink-0 text-xl animate-bounce">
                    🚨
                </div>
                <div class="flex-1 min-w-0">
                    <div class="flex items-center justify-between gap-2">
                        <span class="text-xs font-bold text-red-400 tracking-wide uppercase">中山車管會緊急推播</span>
                        <span class="text-[11px] text-slate-400">剛剛</span>
                    </div>
                    <p id="push-banner-title" class="text-sm font-bold text-white truncate mt-0.5">發現拖吊車！</p>
                    <p id="push-banner-desc" class="text-xs text-slate-300 truncate mt-0.5">請停在紅線或機慢車道旁的同學儘速移車！</p>
                </div>
            </div>
        </div>

        <!-- Top Header & Live Status Bar -->
        <header class="sticky top-0 z-30 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 px-4 pt-3.5 pb-3">
            <div class="flex items-center justify-between gap-2">
                <div class="flex items-center gap-2.5 min-w-0">
                    <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-red-500 to-rose-700 flex items-center justify-center shadow-lg shadow-red-950/50 shrink-0">
                        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                        </svg>
                    </div>
                    <div class="min-w-0">
                        <h1 class="text-base font-black tracking-tight text-white leading-tight truncate">
                            中山車管會拖吊警報器
                        </h1>
                        <p class="text-[11px] text-slate-400 font-medium truncate">西子灣即時互助通報系統 v1.6</p>
                    </div>
                </div>

                <!-- Settings, Sound & LINE Status Controls -->
                <div class="flex items-center gap-1.5 shrink-0">
                    <button id="btn-webhook-settings" type="button" onclick="openWebhookModal()" title="設定 LINE 推播與雲端中繼站" class="relative p-2 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 transition active:scale-95">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                        </svg>
                        <span id="webhook-indicator" class="absolute -top-0.5 -right-0.5 w-2.5 h-2.5 rounded-full bg-emerald-400 border-2 border-slate-900"></span>
                    </button>

                    <button id="btn-sound-toggle" type="button" onclick="toggleSound()" title="切換警報音效" class="p-2 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-emerald-400 transition active:scale-95">
                        <svg id="icon-sound-on" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/>
                        </svg>
                        <svg id="icon-sound-off" class="w-4 h-4 hidden text-slate-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15zM17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2"/>
                        </svg>
                    </button>

                    <button id="btn-line-badge" type="button" onclick="openWebhookModal()" class="px-2.5 py-1.5 rounded-xl bg-emerald-500/15 hover:bg-emerald-500/25 border border-emerald-500/40 text-xs font-bold text-emerald-300 flex items-center gap-1.5 transition active:scale-95">
                        <span id="line-status-dot" class="w-2 h-2 rounded-full bg-emerald-400"></span>
                        <span id="line-status-label">LINE 推播就緒</span>
                    </button>
                </div>
            </div>

            <!-- Live Sync & Campus Status Bar -->
            <div class="mt-2.5 pt-2 border-t border-slate-800/80 flex items-center justify-between text-xs gap-2">
                <div id="sync-status-wrapper" class="flex items-center gap-1.5 text-teal-400 font-medium min-w-0">
                    <span class="relative flex h-2 w-2 shrink-0">
                        <span id="sync-ping-dot" class="animate-ping absolute inline-flex h-full w-full rounded-full bg-teal-400 opacity-75"></span>
                        <span id="sync-solid-dot" class="relative inline-flex rounded-full h-2 w-2 bg-teal-500"></span>
                    </span>
                    <span id="sync-status-text" class="truncate">連線待命・通報直發 LINE</span>
                </div>
                <div id="global-status-pill" class="px-2 py-0.5 rounded-full bg-emerald-500/15 border border-emerald-500/30 text-emerald-400 font-bold text-[11px] shrink-0">
                    ✅ 目前全校安全無拖吊
                </div>
            </div>
        </header>

        <!-- Main Scrollable Content -->
        <main class="flex-1 px-4 py-4 space-y-5 pb-10">

            <!-- Primary One-Tap Emergency Button -->
            <section aria-label="一鍵通報按鈕">
                <button type="button" onclick="openReportModal()" class="w-full relative group overflow-hidden rounded-2xl bg-gradient-to-r from-red-600 via-rose-600 to-red-600 p-4 text-white sos-glow transition-all duration-150 border border-red-400/40">
                    <div class="absolute inset-0 bg-[radial-gradient(circle_at_top_right,rgba(255,255,255,0.22),transparent_60%)]"></div>
                    <div class="relative flex items-center justify-between">
                        <div class="flex items-center gap-3.5 text-left">
                            <div class="w-12 h-12 rounded-2xl bg-white/15 backdrop-blur-sm border border-white/25 flex items-center justify-center text-3xl shrink-0">
                                🚨
                            </div>
                            <div>
                                <div class="inline-flex items-center gap-1 px-2 py-0.5 rounded-md bg-black/25 text-[11px] font-bold tracking-wider uppercase mb-1">
                                    <span>SOS 緊急廣播</span>
                                </div>
                                <h2 class="text-xl font-black tracking-tight leading-none">發現拖吊車！立即通報</h2>
                                <p class="text-xs text-red-100 mt-1 font-medium">點擊選擇校內區域，一秒通知全校同學</p>
                            </div>
                        </div>
                        <div class="w-9 h-9 rounded-full bg-white/20 flex items-center justify-center shrink-0 group-hover:translate-x-0.5 transition-transform">
                            <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/>
                            </svg>
                        </div>
                    </div>
                </button>
            </section>

            <!-- Interactive NSYSU Campus Radar Map -->
            <section class="bg-slate-800/50 border border-slate-700/70 rounded-2xl p-3.5">
                <div class="flex items-center justify-between mb-2.5">
                    <div class="flex items-center gap-1.5">
                        <span class="text-sm">🗺️</span>
                        <h3 class="text-xs font-bold text-slate-200 tracking-wide uppercase">西子灣校區即時熱點雷達</h3>
                    </div>
                    <button id="btn-reset-filter" type="button" onclick="setZoneFilter('all')" class="text-[11px] text-sky-400 hover:text-sky-300 font-semibold hidden">
                        顯示全部區域
                    </button>
                </div>

                <!-- Stylized Interactive SVG Map of NSYSU -->
                <div class="relative w-full h-44 rounded-xl bg-slate-950 border border-slate-800 overflow-hidden select-none">
                    <svg viewBox="0 0 400 180" class="w-full h-full">
                        <!-- Ocean / Xiziwan Bay -->
                        <path d="M0,0 L125,0 C110,45 95,90 120,135 C135,160 175,168 230,180 L0,180 Z" fill="#0C2D48" opacity="0.75"/>
                        <text x="24" y="155" fill="#38BDF8" opacity="0.45" font-size="10" font-weight="700" letter-spacing="1">台灣海峽 / 西子灣海域</text>

                        <!-- Chaishan Mountain / Green Campus Area -->
                        <path d="M125,0 L400,0 L400,180 L230,180 C175,168 135,160 120,135 C95,90 110,45 125,0 Z" fill="#0F172A"/>
                        <path d="M240,10 Q320,40 380,15" stroke="#1E293B" stroke-width="1.5" fill="none"/>
                        <path d="M260,35 Q335,70 395,45" stroke="#1E293B" stroke-width="1.5" fill="none"/>
                        <text x="315" y="25" fill="#475569" font-size="9" font-weight="600">柴山山脈</text>

                        <!-- Main Campus Roads -->
                        <path d="M115,125 Q165,148 245,142 T365,120" stroke="#334155" stroke-width="4" fill="none" stroke-linecap="round"/>
                        <path d="M245,142 L265,75 L335,55" stroke="#334155" stroke-width="3" fill="none" stroke-linecap="round"/>
                        <path d="M115,125 L135,45" stroke="#334155" stroke-width="3" fill="none" stroke-linecap="round"/>

                        <!-- Zone Hotspots -->
                        <g id="map-hotspots"></g>
                    </svg>
                    <div class="absolute bottom-2 right-2.5 flex items-center gap-2.5 bg-slate-900/85 backdrop-blur-sm px-2 py-1 rounded-lg border border-slate-800 text-[10px] text-slate-300">
                        <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></span>拖吊警戒</span>
                        <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-emerald-500"></span>安全無虞</span>
                    </div>
                </div>
            </section>

            <!-- Live Alert Feed Section -->
            <section class="space-y-3">
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-2">
                        <h3 class="text-sm font-extrabold text-white tracking-tight">即時通報動態</h3>
                        <span id="active-count-badge" class="px-2 py-0.5 rounded-full text-[11px] font-bold bg-emerald-500/15 text-emerald-400 border border-emerald-500/30">0 則進行中</span>
                    </div>
                    <button type="button" onclick="fetchCloudAlerts(true)" class="text-[11px] text-slate-400 hover:text-white flex items-center gap-1 transition active:scale-95">
                        <span>🔄 立即更新</span>
                    </button>
                </div>

                <!-- Alert Cards Container -->
                <div id="alert-feed" class="space-y-3"></div>
            </section>

        </main>

        <!-- Quick-Select Report Modal (Centered on Desktop & Mobile) -->
        <div id="report-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4">
            <div onclick="closeReportModal()" class="fixed inset-0 bg-black/75 backdrop-blur-sm transition-opacity"></div>

            <div class="relative z-10 w-full max-w-[440px] bg-slate-900 border border-slate-700 rounded-3xl p-5 shadow-2xl animate-slide-up max-h-[90vh] overflow-y-auto">
                <div class="flex items-center justify-between mb-2.5">
                    <div>
                        <h2 class="text-lg font-black text-white flex items-center gap-2">
                            <span>🚨 選擇發現拖吊車位置</span>
                        </h2>
                        <p class="text-xs text-slate-400 mt-0.5">點擊區域即可同步推播至全校與 LINE 機器人</p>
                    </div>
                    <button type="button" onclick="closeReportModal()" class="w-8 h-8 rounded-full bg-slate-800 text-slate-400 hover:text-white flex items-center justify-center shrink-0">
                        ✕
                    </button>
                </div>

                <!-- Hotspot Grid -->
                <div id="zone-grid" class="grid grid-cols-2 gap-2 my-2.5"></div>

                <!-- Quick Urgency Tags -->
                <div class="mt-3">
                    <label class="block text-xs font-bold text-slate-300 mb-1.5">現場狀況快選（選填）</label>
                    <div id="tag-selector" class="flex flex-wrap gap-1.5">
                        <button type="button" onclick="selectTag(this, '拖車巡邏移動中')" class="tag-btn active px-3 py-1.5 rounded-xl text-xs font-semibold border border-red-500/60 bg-red-500/20 text-red-300 transition">
                            🚛 拖車巡邏移動中
                        </button>
                        <button type="button" onclick="selectTag(this, '正在開單 / 準備上夾')" class="tag-btn px-3 py-1.5 rounded-xl text-xs font-semibold border border-slate-700 bg-slate-800 text-slate-300 hover:border-slate-600 transition">
                            📸 正在開單 / 準備上夾
                        </button>
                        <button type="button" onclick="selectTag(this, '貨車式吊車出沒')" class="tag-btn px-3 py-1.5 rounded-xl text-xs font-semibold border border-slate-700 bg-slate-800 text-slate-300 hover:border-slate-600 transition">
                            🏗️ 貨車式吊車出沒
                        </button>
                    </div>
                </div>

                <!-- Optional Short Note -->
                <div class="mt-3">
                    <input id="custom-note" type="text" maxlength="40" placeholder="補充說明（例如：往海堤方向開過去了...）" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-950 border border-slate-700 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-red-500">
                </div>

                <!-- Submit Action -->
                <button id="btn-submit-report" type="button" onclick="submitReport()" disabled class="w-full mt-3.5 py-3.5 rounded-2xl bg-red-600 hover:bg-red-500 disabled:opacity-40 disabled:cursor-not-allowed text-white font-black text-base shadow-lg shadow-red-950/60 transition active:scale-[0.98]">
                    請先選擇上方區域
                </button>
            </div>
        </div>

        <!-- LINE Webhook & Cloud Relay Settings Modal (Centered on Desktop & Mobile) -->
        <div id="webhook-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4">
            <div onclick="closeWebhookModal()" class="fixed inset-0 bg-black/75 backdrop-blur-sm transition-opacity"></div>

            <div class="relative z-10 w-full max-w-[440px] bg-slate-900 border border-slate-700 rounded-3xl p-5 shadow-2xl animate-slide-up max-h-[90vh] overflow-y-auto">
                <div class="flex items-center justify-between mb-3">
                    <div>
                        <h2 class="text-lg font-black text-white flex items-center gap-2">
                            <span>🔗 LINE 推播與雲端中繼站</span>
                        </h2>
                        <p class="text-xs text-slate-400 mt-0.5">已內建預設 Google Apps Script 網址，可在此測試推播</p>
                    </div>
                    <button type="button" onclick="closeWebhookModal()" class="w-8 h-8 rounded-full bg-slate-800 text-slate-400 hover:text-white flex items-center justify-center shrink-0">
                        ✕
                    </button>
                </div>

                <div class="space-y-3 my-3">
                    <div>
                        <label for="webhook-url-input" class="block text-xs font-bold text-slate-300 mb-1.5">Google Apps Script 網頁應用程式網址</label>
                        <input id="webhook-url-input" type="url" placeholder="https://script.google.com/macros/s/你的部署網址/exec" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-950 border border-slate-700 text-xs font-mono text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500">
                    </div>

                    <div id="webhook-current-status" class="p-3 rounded-xl bg-slate-950/70 border border-slate-800 text-xs text-slate-300 break-all">
                        狀態檢查中...
                    </div>
                </div>

                <div class="grid grid-cols-3 gap-2 mt-4">
                    <button type="button" onclick="testLineWebhook()" class="py-3 px-2 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-600 text-slate-200 font-bold text-xs transition active:scale-[0.98]">
                        📡 發送測試推播
                    </button>
                    <button type="button" onclick="resetWebhookToDefault()" class="py-3 px-2 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-600 text-amber-300 font-bold text-xs transition active:scale-[0.98]">
                        🔄 恢復預設
                    </button>
                    <button type="button" onclick="saveWebhookSettings()" class="py-3 px-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-black text-xs shadow-lg shadow-emerald-950/50 transition active:scale-[0.98]">
                        💾 儲存網址
                    </button>
                </div>
            </div>
        </div>

        <!-- Toast Feedback Message -->
        <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 px-4 py-2.5 rounded-xl bg-slate-800 border border-slate-600 text-white text-xs font-bold shadow-2xl opacity-0 pointer-events-none transition-all duration-200 whitespace-nowrap max-w-[92vw] truncate">
        </div>

    </div>

    <script>
        // ==========================================
        // 1. Google Apps Script Backend & LINE Webhook Configuration
        // ==========================================
        const DEFAULT_GAS_LINE_WEBHOOK_URL = 'https://script.google.com/macros/s/AKfycbz1eGSkQ2ZM97hAljPD1TRpbslu6efX8zkErWX25P8FGaUQMzKe3PeQPjAc51n68QQ3Lg/exec';
        const STALE_WEBHOOK_IDS = [
            'AKfycby6FxCT2UrSsrn41CpK0mScJ7U91kb',
            'AKfycbyv0nKZVtDVrhrVefbpb0728EnRBdpPOjLZTvCGuAXu6qfsqWS9VJ5-G4zcTbZ_tvFJ_g',
            'AKfycbx75W91fxrn0TUOMhpLPjnqeqgSgsKtamq3h7M8UDX0MjH_aJONtKxlEz-odaDwp02sDQ'
        ];
        const WEBHOOK_STORAGE_KEY = 'nsysu_gas_line_webhook_url_v1';
        const CONFIRMED_STORAGE_KEY = 'nsysu_confirmed_alert_ids_v1';
        const ALERT_TTL_MS = 15 * 60 * 1000;

        // ==========================================
        // 2. NSYSU Campus Hotspots Definition
        // ==========================================
        const CAMPUS_ZONES = [
            {
                id: 'seawall',
                name: '海堤 / 體育館',
                shortName: '海堤',
                sub: '蓮海路・海資館前',
                icon: '🌊',
                x: 115,
                y: 125
            },
            {

        // ==========================================
        // 3. Application State
        // ==========================================
        let alerts = [];
        let confirmedIds = [];
        let selectedZoneId = null;
        let selectedTag = '拖車巡邏移動中';
        let zoneFilter = 'all';
        let soundEnabled = true;
        let isCloudSynced = false;
        let isSubmitting = false;

        // ==========================================
        // 4. Initialization & Stale URL Migration
        // ==========================================
        function migrateStaleWebhookUrl() {
            try {
                const saved = localStorage.getItem(WEBHOOK_STORAGE_KEY);
                if (!saved) {
                    localStorage.setItem(WEBHOOK_STORAGE_KEY, DEFAULT_GAS_LINE_WEBHOOK_URL);
                    return;
                }
                const isStale = STALE_WEBHOOK_IDS.some(id => saved.includes(id));
                if (isStale || !saved.startsWith('https://script.google.com/macros/s/')) {
                    localStorage.setItem(WEBHOOK_STORAGE_KEY, DEFAULT_GAS_LINE_WEBHOOK_URL);
                }
            } catch (e) {
                console.warn('Storage access warning:', e);
            }
        }

        function getWebhookUrl() {
            try {
                const saved = localStorage.getItem(WEBHOOK_STORAGE_KEY);
                return (saved && saved.trim()) ? saved.trim() : DEFAULT_GAS_LINE_WEBHOOK_URL;
            } catch (e) {
                return DEFAULT_GAS_LINE_WEBHOOK_URL;
            }
        }

        function loadConfirmedIds() {
            try {
                const raw = localStorage.getItem(CONFIRMED_STORAGE_KEY);
                confirmedIds = raw ? JSON.parse(raw) : [];
            } catch (e) {
                confirmedIds = [];
            }
        }

        function saveConfirmedIds() {
            try {
                localStorage.setItem(CONFIRMED_STORAGE_KEY, JSON.stringify(confirmedIds.slice(-100)));
            } catch (e) {}
        }

        window.addEventListener('DOMContentLoaded', () => {
            migrateStaleWebhookUrl();
            loadConfirmedIds();
            renderZoneModalGrid();
            updateWebhookBadgeUI();
            renderAll();

            // Fetch real cloud alerts immediately and poll every 10 seconds
            fetchCloudAlerts(false);
            setInterval(() => fetchCloudAlerts(false), 10000);

            // Live countdown ticker every 1 second for active alerts
            setInterval(() => {
                if (alerts.some(a => a.status === 'active')) {
                    renderAlertFeed();
                    updateGlobalStatus();
                }
            }, 1000);
        });

        // ==========================================
        // 5. Cloud Synchronization (GAS doGet & doPost)
        // ==========================================
        async function fetchCloudAlerts(manual = false) {
            const url = getWebhookUrl();
            if (!url) return;

            try {
                const sep = url.includes('?') ? '&' : '?';
                const res = await fetch(`${url}${sep}t=${Date.now()}`, {
                    method: 'GET',
                    cache: 'no-store'
                });
                const text = await res.text();
                const data = JSON.parse(text);

                if (data && data.ok && Array.isArray(data.alerts)) {
                    const prevActiveIds = new Set(alerts.filter(a => a.status === 'active').map(a => a.id));
                    alerts = data.alerts;

                    // Trigger banner & chime when a new active alert arrives from another device
                    if (isCloudSynced) {
                        const newlyArrived = alerts.find(a => a.status === 'active' && !prevActiveIds.has(a.id));
                        if (newlyArrived) {
                            const zone = getZoneById(newlyArrived.zoneId);
                            playAlertChime();
                            showPushBanner(
                                `${zone ? zone.name : '校內區域'} 發現拖吊車！`,
                                newlyArrived.note || newlyArrived.tag
                            );
                        }
                    }

                    setSyncConnectionState(true);
                    renderAll();
                    if (manual) showToast('✅ 已同步最新雲端通報狀態');
                } else {
                    setSyncConnectionState(false);
                    if (manual) showToast('⚠️ 雲端回傳格式異常，請檢查 GAS 部署');
                }
            } catch (err) {
                console.warn('Cloud fetch error:', err);
                setSyncConnectionState(false);
                if (manual) showToast('⚠️ 尚未讀取到雲端資料（請確認 GAS 部署權限為所有人）');
            }
        }

        async function postToGas(payload) {
            const url = getWebhookUrl();
            if (!url) return { ok: false };

            const res = await fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'text/plain;charset=utf-8'
                },
                body: JSON.stringify(payload)
            });

            const text = await res.text();
            try {
                return JSON.parse(text);
            } catch (e) {
                return { ok: res.ok };
            }
        }

        function setSyncConnectionState(connected) {
            isCloudSynced = connected;
            const wrapper = document.getElementById('sync-status-wrapper');
            const pingDot = document.getElementById('sync-ping-dot');
            const solidDot = document.getElementById('sync-solid-dot');
            const label = document.getElementById('sync-status-text');

            if (connected) {
                wrapper.className = 'flex items-center gap-1.5 text-emerald-400 font-medium min-w-0';
                pingDot.className = 'animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75';
                solidDot.className = 'relative inline-flex rounded-full h-2 w-2 bg-emerald-500';
                label.textContent = '雲端即時同步中・通報直發 LINE';
            } else {
                wrapper.className = 'flex items-center gap-1.5 text-teal-400 font-medium min-w-0';
                pingDot.className = 'animate-ping absolute inline-flex h-full w-full rounded-full bg-teal-400 opacity-75';
                solidDot.className = 'relative inline-flex rounded-full h-2 w-2 bg-teal-500';
                label.textContent = '連線待命・通報直發 LINE';
            }
        }

        function selectTag(el, tagText) {
            selectedTag = tagText;
            document.querySelectorAll('.tag-btn').forEach(btn => {

        async function submitReport() {
            if (!selectedZoneId || isSubmitting) return;
            const zone = getZoneById(selectedZoneId);
            const customNote = document.getElementById('custom-note').value.trim();
            const fullNote = customNote
                ? `${selectedTag} — ${customNote}`
                : `${selectedTag} — ${zone.name}發現車管會拖吊車，請附近同學注意！`;

            isSubmitting = true;
            const btn = document.getElementById('btn-submit-report');
            btn.disabled = true;
            btn.textContent = '⏳ 正在同步雲端與發送 LINE...';

            try {
                const res = await postToGas({
                    action: 'report',
                    zoneId: zone.id,
                    area: zone.name,
                    tag: selectedTag,
                    note: fullNote
                });

                closeReportModal();
                triggerFlashEffect();
                playAlertChime();

                if (res && res.merged) {
                    showToast(`👀 已合併至「${zone.name}」進行中通報（確認人數 +1）`);
                } else {
                    showPushBanner(`🚨 ${zone.name} 拖吊警報已發送！`, fullNote);
                    showToast('🚨 警報已同步雲端並推播至 LINE！');
                }

                await fetchCloudAlerts(false);
            } catch (err) {
                showToast('⚠️ 傳送失敗，請檢查網路連線後重試');
            } finally {
                isSubmitting = false;
            }
        }

        async function confirmAlert(alertId) {
            if (confirmedIds.includes(alertId)) {
                showToast('你已經確認過這則通報囉！');
                return;
            }

            confirmedIds.push(alertId);
            saveConfirmedIds();

            const target = alerts.find(a => a.id === alertId);
            if (target) {
                target.confirmations = (Number(target.confirmations) || 1) + 1;
                renderAlertFeed();
            }

            showToast('👀 已送出目擊確認 (+1)');
            try {
                await postToGas({
                    action: 'confirm',
                    alertId: alertId
                });
                await fetchCloudAlerts(false);
            } catch (err) {
                console.warn('Confirm failed:', err);
            }
        }

        async function clearAlert(alertId) {
            const target = alerts.find(a => a.id === alertId);
            const zone = target ? getZoneById(target.zoneId) : null;
            const areaName = zone ? zone.name : '校內區域';

            if (target) {
                target.status = 'cleared';
                target.clearedAt = Date.now();
                renderAll();
            }

            showToast(`✅ 已回報「${areaName}」拖車離開，發送 LINE 解除通知`);
            try {
                await postToGas({
                    action: 'cleared',
                    alertId: alertId,
                    area: areaName,
                    note: '同學回報拖吊車已離開現場，解除警戒'
                });
                await fetchCloudAlerts(false);
            } catch (err) {
                console.warn('Clear failed:', err);
            }
        }

        function updateGlobalStatus() {

            const activeAlerts = alerts.filter(a => a.status === 'active' && (now - Number(a.createdAt)) < ALERT_TTL_MS);
            const pill = document.getElementById('global-status-pill');
            const badge = document.getElementById('active-count-badge');

            if (activeAlerts.length > 0) {

                pill.className = 'px-2 py-0.5 rounded-full bg-emerald-500/15 border border-emerald-500/30 text-emerald-400 font-bold text-[11px] shrink-0';
                pill.textContent = '✅ 目前全校安全無拖吊';

        function renderRadarMap() {
            const container = document.getElementById('map-hotspots');
            const now = Date.now();
            const activeZoneIds = new Set(
                alerts
                    .filter(a => a.status === 'active' && (now - Number(a.createdAt)) < ALERT_TTL_MS)
                    .map(a => a.zoneId)
            );

            container.innerHTML = CAMPUS_ZONES.map(z => {
                const isAlert = activeZoneIds.has(z.id);
                const isFiltered = zoneFilter === z.id;
                const color = isAlert ? '#EF4444' : '#10B981';
                const labelBg = isAlert ? '#7F1D1D' : '#1E293B';
                const labelStroke = isAlert ? '#EF4444' : (isFiltered ? '#38BDF8' : '#334155');
                const labelWidth = z.shortName.length * 10 + 16;

                return `
                    <g onclick="setZoneFilter('${zoneFilter === z.id ? 'all' : z.id}')" class="cursor-pointer">
                        ${isAlert ? `
                            <circle cx="${z.x}" cy="${z.y}" r="14" fill="${color}" opacity="0.35">
                                <animate attributeName="r" from="6" to="22" dur="1.6s" repeatCount="indefinite"/>
                                <animate attributeName="opacity" from="0.7" to="0" dur="1.6s" repeatCount="indefinite"/>
                            </circle>
                        ` : ''}
                        <circle cx="${z.x}" cy="${z.y}" r="${isFiltered ? 7.5 : 5.5}" fill="${color}" stroke="#0F172A" stroke-width="2"/>
                        <rect x="${z.x - labelWidth / 2}" y="${z.y + 9}" width="${labelWidth}" height="16" rx="5" fill="${labelBg}" stroke="${labelStroke}" stroke-width="1"/>
                        <text x="${z.x}" y="${z.y + 20}" text-anchor="middle" fill="#F8FAFC" font-size="9" font-weight="700">${z.shortName}</text>

        function renderAlertFeed() {
            const feed = document.getElementById('alert-feed');
            const now = Date.now();
            const filtered = zoneFilter === 'all'
                ? alerts
                : alerts.filter(a => a.zoneId === zoneFilter);

            if (filtered.length === 0) {
                feed.innerHTML = `
                    <div class="bg-slate-800/40 border border-slate-800 rounded-2xl p-8 text-center">
                        <div class="text-4xl mb-2.5">🛵</div>
                        <p class="text-sm font-bold text-slate-200">目前尚無真實拖吊通報紀錄</p>
                        <p class="text-xs text-slate-400 mt-1 leading-relaxed">
                            若在校內發現拖吊車，點擊上方紅色按鈕即可即時通知全校與 LINE
                        </p>
                    </div>
                `;
                return;
            }

            feed.innerHTML = filtered.map(item => {
                const zone = getZoneById(item.zoneId) || { name: item.zoneId, icon: '🚨' };
                const created = Number(item.createdAt) || now;
                const elapsed = Math.max(0, now - created);
                const remaining = Math.max(0, ALERT_TTL_MS - elapsed);
                const isActive = item.status === 'active' && remaining > 0;
                const confirmations = Number(item.confirmations) || 1;
                const hasConfirmed = confirmedIds.includes(item.id);

                if (isActive) {
                    const remMin = String(Math.floor(remaining / 60000)).padStart(2, '0');
                    const remSec = String(Math.floor((remaining % 60000) / 1000)).padStart(2, '0');

                    return `
                        <article class="bg-gradient-to-b from-red-950/45 to-slate-800/90 border border-red-500/45 rounded-2xl p-4 shadow-lg">
                            <div class="flex items-start justify-between gap-2">
                                <div class="flex items-center gap-2.5 min-w-0">

                                    </div>
                                    <div class="min-w-0">
                                        <div class="flex items-center gap-1.5 flex-wrap">
                                            <h4 class="text-sm font-black text-white truncate">${zone.name}</h4>
                                            <span class="px-2 py-0.5 rounded-md bg-red-500/25 border border-red-500/40 text-[10px] font-bold text-red-200">

                                            </span>
                                        </div>
                                        <p class="text-[11px] text-slate-300 mt-0.5">
                                            ${formatRelativeTime(created)} ・ 剩餘 <span class="font-mono font-bold text-red-300">${remMin}:${remSec}</span> 自動解除
                                        </p>
                                    </div>
                                </div>
                                <span class="w-2.5 h-2.5 rounded-full bg-red-500 animate-ping shrink-0 mt-1.5"></span>
                            </div>

                            <div class="mt-3 p-3 rounded-xl bg-slate-950/70 border border-slate-800/90 text-xs text-slate-100 leading-relaxed">
                                「${escapeHtml(item.note)}」
                            </div>

                            <div class="grid grid-cols-5 gap-2 mt-3">
                                <button type="button" onclick="confirmAlert('${item.id}')"
                                    class="col-span-3 py-2.5 px-3 rounded-xl font-bold text-xs flex items-center justify-center gap-1.5 transition active:scale-[0.98] ${
                                        hasConfirmed
                                            ? 'bg-amber-500/20 border border-amber-500/50 text-amber-200'
                                            : 'bg-amber-500 hover:bg-amber-400 text-slate-950 shadow-md shadow-amber-950/40'
                                    }">
                                    <span>👀</span>
                                    <span>${hasConfirmed ? `已確認目擊 (${confirmations})` : `+1 我也看到了 (${confirmations})`}</span>
                                </button>
                                <button type="button" onclick="clearAlert('${item.id}')"
                                    class="col-span-2 py-2.5 px-3 rounded-xl bg-emerald-600/20 hover:bg-emerald-600/30 border border-emerald-500/50 text-emerald-300 font-bold text-xs flex items-center justify-center gap-1 transition active:scale-[0.98]">
                                    <span>✅</span>
                                    <span>拖車已離開</span>
                                </button>
                            </div>
                        </article>
                    `;
                } else {
                    return `
                        <article class="bg-slate-800/40 border border-slate-800 rounded-2xl p-3.5 opacity-80">
                            <div class="flex items-center justify-between gap-2">
                                <div class="flex items-center gap-2.5 min-w-0">
                                    <div class="w-9 h-9 rounded-xl bg-slate-800 border border-slate-700 flex items-center justify-center text-lg shrink-0 grayscale">

                                    <div class="min-w-0">
                                        <div class="flex items-center gap-2">
                                            <h4 class="text-xs font-bold text-slate-300 truncate">${zone.name}</h4>

                                        </p>
                                    </div>
                                </div>
                            </div>
                        </article>
                    `;
                }
            }).join('');
        }

        async function testLineWebhook() {
            showToast('📡 正在發送 LINE 測試推播...');
            try {
                const res = await postToGas({
                    action: 'test',
                    area: '測試連線區域',
                    note: '前端與 LINE 推播連線測試成功！'
                });
                if (res && res.ok) {
                    showToast('✅ 測試推播已送出，請查看手機 LINE 訊息！');
                } else {
                    showToast('⚠️ 推播請求已送出，但後端未回傳 ok');
                }
            } catch (err) {
                showToast('⚠️ 測試連線失敗，請檢查 GAS 部署權限');
            }
        }

        // ==========================================
        // 9. Utilities, Sound & Visual Feedback
        // ==========================================
        function getZoneById(id) {
            return CAMPUS_ZONES.find(z => z.id === id);
        }

        function formatRelativeTime(timestamp) {
            const diffSec = Math.max(1, Math.floor((Date.now() - timestamp) / 1000));
            if (diffSec < 60) return '剛剛通報';
            const diffMin = Math.floor(diffSec / 60);
            if (diffMin < 60) return `${diffMin} 分鐘前通報`;
            const diffHr = Math.floor(diffMin / 60);
            return `${diffHr} 小時前通報`;
        }

        function escapeHtml(str) {
            return String(str || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            document.getElementById('icon-sound-on').classList.toggle('hidden', !soundEnabled);
            document.getElementById('icon-sound-off').classList.toggle('hidden', soundEnabled);
            showToast(soundEnabled ? '🔔 已開啟警報音效' : '🔕 已靜音警報音效');
            if (soundEnabled) playAlertChime();
        }

        function playAlertChime() {
            if (!soundEnabled) return;
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                const ctx = new AudioCtx();
                const now = ctx.currentTime;
                [880, 1174.66].forEach((freq, idx) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, now + idx * 0.14);
                    gain.gain.setValueAtTime(0.16, now + idx * 0.14);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.14 + 0.25);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now + idx * 0.14);
                    osc.stop(now + idx * 0.14 + 0.26);
                });
            } catch (e) {}
        }

        function triggerFlashEffect() {
            const shell = document.getElementById('app-shell');
            shell.classList.remove('animate-flash-red');
            void shell.offsetWidth;
            shell.classList.add('animate-flash-red');
        }

        let bannerTimer = null;
        function showPushBanner(title, desc) {
            const banner = document.getElementById('push-banner');
            document.getElementById('push-banner-title').textContent = title;
            document.getElementById('push-banner-desc').textContent = desc;
            banner.classList.remove('opacity-0', '-translate-y-6');
            banner.classList.add('opacity-100', 'translate-y-0');

            clearTimeout(bannerTimer);
            bannerTimer = setTimeout(() => {
                banner.classList.add('opacity-0', '-translate-y-6');
                banner.classList.remove('opacity-100', 'translate-y-0');
            }, 4200);
        }

        let toastTimer = null;
        function showToast(msg) {
            const el = document.getElementById('toast');
            el.textContent = msg;
            el.classList.remove('opacity-0');
            el.classList.add('opacity-100');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                el.classList.add('opacity-0');
                el.classList.remove('opacity-100');
            }, 3000);
        }
    </script>
</body>
